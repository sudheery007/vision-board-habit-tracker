    /* ---------- Sheets, flows, dialogs ---------- */
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    @keyframes rise { from { transform:translateY(100%); } to { transform:none; } }
    @keyframes pop { 0% { transform:scale(.94); } 50% { transform:scale(1.04); } 100% { transform:scale(1); } }
    .animate-pop { animation:pop .26s cubic-bezier(.16,1,.3,1); }
    .sheet-backdrop { position:fixed; inset:0; z-index:50; background:var(--backdrop); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); animation:fade .2s ease-out; }
    .sheet-panel { position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--sheet); border-radius:32px 32px 0 0;
                   border-top:1px solid var(--card-b); box-shadow:var(--shadow); max-height:calc(100dvh - var(--sat) - 8px);
                   overflow-y:auto; overscroll-behavior:contain; padding-bottom:calc(var(--sab) + 14px);
                   animation:rise .28s cubic-bezier(.16,1,.3,1); }
    .sheet-grab { height:28px; display:flex; align-items:center; justify-content:center; touch-action:none; }
    .sheet-grab::before { content:''; width:36px; height:5px; border-radius:9999px; background:var(--faint); opacity:.55; }
    .sheet-pad { padding:0 20px; }
    .flow-page { position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; overscroll-behavior:contain;
                 padding:var(--sat) 20px calc(var(--sab) + 14px); animation:fade .2s ease-out; }
    .flow-inner { max-width:28rem; margin:0 auto; min-height:calc(100dvh - var(--sat) - var(--sab) - 14px); display:flex; flex-direction:column; }
    .confirm-wrap { position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--backdrop); animation:fade .15s ease-out; }
    .toast { position:fixed; left:50%; top:calc(var(--sat) + 10px); z-index:80; transform:translate(-50%,-14px); opacity:0; pointer-events:none;
             transition:opacity .2s, transform .2s; max-width:calc(100vw - 32px); }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (min-width:768px) {
      .sheet-panel { left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%); width:min(30rem,calc(100vw - 2rem));
                     border-radius:28px; max-height:88vh; animation:fade .2s ease-out; }
      .sheet-grab { display:none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  <script>

// ---------------------------------------------------------------- tiny utilities
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hexa = (c, a) => c + Math.round(a * 255).toString(16).padStart(2, '0');
function hashStr(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';

}

function offsetKey(daysAgo) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - daysAgo); return formatDateKey(d); }
function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function newMemberId() {
  const b = crypto.getRandomValues(new Uint8Array(5));
  return 'm' + Array.from(b, x => (x % 36).toString(36)).join('') + Date.now().toString(36).slice(-3);

function timeAgo(ts) {
  const m = Math.max(1, Math.round((Date.now() - (ts || Date.now())) / 60000));
  if (m < 60) return `${m}m ago`;

function normalizeRoomCode(code) { return String(code || '').trim().toUpperCase().replace(/[^A-Z0-9-_]/g, ''); }
function maskRoomCode(code) { return code.length > 8 ? code.slice(0, 5) + '••••-••••-' + code.slice(-4) : code; }

  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 32 unambiguous symbols, 12 of them is ~60 bits

  const c = Array.from(bytes, b => alphabet[b % alphabet.length]);

// ---------------------------------------------------------------- state: load, migrate, save
function freshState() {
  return {
    theme: 'dark', activeTab: 'today', visionFilter: 'all', pillarFilter: 'all',
    rooms: [], roomCode: null, members: {}, ownerId: null,
    cheers: [], visions: [], habits: [], deleted: {}, seen: {}, baseHostUrl: ''
  };
}
function legacyMembers(names) {
  const n = names || {};
  return {
    p1: { name: (n.p1 && n.p1.name) || 'Sudheer', color: SWATCHES[0], uid: null, joinedAt: 1 },
    p2: { name: (n.p2 && n.p2.name) || 'Devi', color: SWATCHES[1], uid: null, joinedAt: 2 }
  };
}
function legacyMembersFrom(remotePayload) { return remotePayload && remotePayload.partners ? legacyMembers(remotePayload.partners) : null; }

function normalizeHabit(h) {
  if (h.partnerHistory) return h;
  return { ...h, partnerHistory: { p1: { ...(h.history || {}) } } };   // very old habits kept one shared history
}
function pruneHistory(habits, days = HISTORY_DAYS) {
  const cutoff = offsetKey(days);
  (habits || []).forEach(h => {
    Object.keys(h.partnerHistory || {}).forEach(id => {
      const hist = h.partnerHistory[id] || {};
      Object.keys(hist).forEach(k => { if (k < cutoff) delete hist[k]; });
    });
  });
}

// v1 → v2: the old state had `partners {p1,p2}`, `activeIdentity`, `ownerFilter`. Habit/vision/cheer data already uses
// 'p1' / 'p2' ids, so those simply become the first two members and nothing is rewritten.
function readRawCache(code) { try { const r = localStorage.getItem(ROOM_CACHE_PREFIX + code); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function migrateLegacyState(s, p) {
  const me = p.activeIdentity === 'p2' ? 'p2' : 'p1';
  s.members = legacyMembers(p.partners);
  s.ownerId = 'p1';
  s.rooms = (p.rooms || []).filter(r => r && r.code);
  if (p.roomCode && !s.rooms.some(r => r.code === p.roomCode)) s.rooms.push({ code: p.roomCode, name: 'Our Room' });
  s.rooms.forEach(r => {
    if (r.code === p.roomCode) { r.me = me; return; }
    const c = readRawCache(r.code);
    r.me = c && c.activeIdentity === 'p2' ? 'p2' : 'p1';
    if (c && c.partners && !c.members) {   // rewrite the stashed copy of that room in the new shape
      try {
        localStorage.setItem(ROOM_CACHE_PREFIX + r.code, JSON.stringify({
          members: legacyMembers(c.partners), ownerId: 'p1', cheers: c.cheers || [], visions: c.visions || [],
          habits: c.habits || [], deleted: c.deleted || {}
        }));
      } catch (e) { /* ignore */ }
    }
  });
  const f = p.ownerFilter;
  s.visionFilter = f === 'shared' ? 'shared' : (f === 'p1' || f === 'p2') ? 'mine' : 'all';
}
function normalizeLoaded(p) {
  const s = { ...freshState(), ...p };
  if (p.partners && !p.members) migrateLegacyState(s, p);
  s.rooms = Array.isArray(s.rooms) ? s.rooms.filter(r => r && r.code) : [];
  s.members = s.members && typeof s.members === 'object' ? s.members : {};
  s.habits = (Array.isArray(s.habits) ? s.habits : []).map(normalizeHabit);
  s.visions = (Array.isArray(s.visions) ? s.visions : []).map(v => ({ owner: 'shared', ...v }));
  s.cheers = Array.isArray(s.cheers) ? s.cheers : [];
  s.deleted = s.deleted && typeof s.deleted === 'object' ? s.deleted : {};
  s.seen = s.seen && typeof s.seen === 'object' ? s.seen : {};
  if (!['today', 'habits', 'vision', 'team', 'me'].includes(s.activeTab)) s.activeTab = 'today';   // old tab ids (dashboard, analytics)
  if (!['all', 'mine', 'shared'].includes(s.visionFilter)) s.visionFilter = 'all';
  delete s.partners; delete s.activeIdentity; delete s.ownerFilter;
  pruneHistory(s.habits);
  return s;
}
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { /* storage blocked */ }
  if (!raw) return freshState();
  try { return normalizeLoaded(JSON.parse(raw)); } catch (e) { console.error('Error loading state:', e); return freshState(); }
}
function saveState(skipCloud = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (!skipCloud && window.Cloud) window.Cloud.push();
  } catch (e) { console.error('Error saving state:', e); }
}

// ---------------------------------------------------------------- rooms registry (rooms this device belongs to)
function defaultRoomName(code) { return `Room ${code.slice(-4)}`; }
function ensureRegistry() {
  state.rooms = (Array.isArray(state.rooms) ? state.rooms : []).filter(r => r && r.code);
  if (state.roomCode && !state.rooms.some(r => r.code === state.roomCode)) {
    state.rooms.push({ code: state.roomCode, name: defaultRoomName(state.roomCode), me: null });
  }
  if (!state.roomCode && state.rooms.length) {
    state.roomCode = state.rooms[0].code;
    const data = readRoomCache(state.roomCode);
    if (data) Object.assign(state, data);
  }
}
const getRoom = code => state.rooms.find(r => r.code === code) || null;
const getCurrentRoom = () => getRoom(state.roomCode);
const hasRoom = () => !!getCurrentRoom();
const roomName = () => { const r = getCurrentRoom(); return (r && r.name) || 'Room'; };

function stashCurrentRoom() {
  if (!state.roomCode) return;
  try {
    localStorage.setItem(ROOM_CACHE_PREFIX + state.roomCode, JSON.stringify({
      members: state.members, ownerId: state.ownerId, cheers: state.cheers || [], visions: state.visions || [],
      habits: state.habits || [], deleted: state.deleted || {}
    }));
  } catch (e) { console.error('Error saving room cache:', e); }
}
function readRoomCache(code) { return readRawCache(code); }
const blankRoomData = () => ({ members: {}, ownerId: null, cheers: [], visions: [], habits: [], deleted: {} });

function registerRoom({ code, name, me }) {
  let r = getRoom(code);
  if (!r) { r = { code, name: name || defaultRoomName(code), me: me || null }; state.rooms.push(r); }
  else { if (name) r.name = name; if (me) r.me = me; }
  return r;
}
// Synchronous core of a room switch: stash the room we are leaving, then load the target room from its local copy.
function applyRoomSwitch(code) {
  code = normalizeRoomCode(code);
  if (!code || !getRoom(code)) return false;
  if (code === state.roomCode) return true;
  stashCurrentRoom();
  const data = readRoomCache(code) || blankRoomData();
  state = { ...state, ...data, roomCode: code };
  saveState(true);
  return true;
}
function removeRoomLocal(code) {
  state.rooms = state.rooms.filter(r => r.code !== code);
  try { localStorage.removeItem(ROOM_CACHE_PREFIX + code); } catch (e) { /* ignore */ }
  if (state.roomCode === code) {
    state.roomCode = null; Object.assign(state, blankRoomData());
    ensureRegistry();   // falls back to another saved room, if any
  }
  saveState(true);
}

// ---------------------------------------------------------------- members

const seatsTaken = () => memberIds().length;

const nameOf = id => (state.members && state.members[id] && state.members[id].name) || (id === 'shared' ? 'Everyone' : 'Someone');

// ---------------------------------------------------------------- habits & stats
const histOf = (h, id) => (h.partnerHistory && h.partnerHistory[id]) || {};
const isDone = (h, key, id) => !!histOf(h, id)[key];
const habitsFor = id => state.habits.filter(h => h.owner === 'shared' || h.owner === id);

function calculateHabitStreak(history) {
  let current = 0;
  const startOffset = history[offsetKey(0)] ? 0 : (history[offsetKey(1)] ? 1 : -1);
  if (startOffset !== -1) {
    for (let i = startOffset; i < HISTORY_DAYS; i++) { if (history[offsetKey(i)]) current++; else break; }
  }
  let best = 0, temp = 0;
  for (let i = 180; i >= 0; i--) { if (history[offsetKey(i)]) { temp++; if (temp > best) best = temp; } else temp = 0; }
  return { current, best: Math.max(current, best) };
}
function last7Count(history) { let c = 0; for (let i = 0; i < 7; i++) if (history[offsetKey(i)]) c++; return c; }

  const key = offsetKey(0), hs = habitsFor(id);
  const done = hs.filter(h => isDone(h, key, id)).length;
  let streak = 0;
  hs.forEach(h => { const s = calculateHabitStreak(histOf(h, id)).current; if (s > streak) streak = s; });
  return { total: hs.length, done, pct: hs.length ? Math.round(done / hs.length * 100) : 0, streak };

// ================================================================= Habits (week view)

}

  const head = days.map(d => `<div class="flex flex-col items-center leading-tight"><span class="text-[12px] font-semibold ${d.today ? 'ta' : 't4'}">${d.today ? 'Today' : d.letter}</span><span class="text-[13px] font-bold ${d.today ? 'ta' : 't2'}">${d.num}</span></div>`).join('');

        const rm = new Map((r || []).filter(isLive).map(x => [x.id, x]));
        const order = preferRemote ? [rm, lm] : [lm, rm];
        const ids = new Set([...order[0].keys(), ...order[1].keys()]);
        return [...ids].map(id => { const a = lm.get(id), b = rm.get(id); return a && b ? combine(a, b) : (a || b); });
      };
      const visions = mergeList(local.visions, remote.visions, (a, b) => (preferRemote ? b : a));
      const habits = mergeList(local.habits, remote.habits, (a0, b0) => {
        const a = A().normalizeHabit(a0), b = A().normalizeHabit(b0), win = preferRemote ? b : a;
        const people = new Set([...Object.keys(a.partnerHistory || {}), ...Object.keys(b.partnerHistory || {}), ...Object.keys(a.historyAt || {}), ...Object.keys(b.historyAt || {})]);
        const partnerHistory = {}, historyAt = {};
        people.forEach(p => {
          const ta = (a.historyAt || {})[p] || 0, tb = (b.historyAt || {})[p] || 0;
          const pickRemote = tb > ta || (tb === ta && preferRemote);
          partnerHistory[p] = ((pickRemote ? b : a).partnerHistory || {})[p] || {};
          historyAt[p] = Math.max(ta, tb);
        });
        const out = { ...win, partnerHistory, historyAt }; delete out.history;
        return out;
      }).map(A().normalizeHabit);
      const cheerMap = new Map();
      (preferRemote ? [remote.cheers, local.cheers] : [local.cheers, remote.cheers]).forEach(list => {
        (list || []).forEach(c => { if (isLive(c) && !cheerMap.has(c.id)) cheerMap.set(c.id, c); });
      });
      const cheers = [...cheerMap.values()].sort((x, y) => (y.timestamp || 0) - (x.timestamp || 0)).slice(0, 100);
      return { cheers, visions, habits, deleted };
    }
    function fingerprint(s) {
      const byId = list => [...(list || [])].sort((a, b) => String(a.id).localeCompare(String(b.id)));
      return A().stable({ deleted: s.deleted || {}, cheers: byId(s.cheers), visions: byId(s.visions), habits: byId(s.habits).map(h => { const n = A().normalizeHabit(h); const o = { ...n }; delete o.history; return o; }) });
    }
    function parsePayload(data) {
      try { return data && data.payload ? JSON.parse(data.payload) : null; } catch (e) { console.error('Error parsing remote room payload:', e); return null; }
    }
    function applyIfChanged(merged) {
      if (fingerprint(merged) === fingerprint(sharedSnapshot())) return;
      isApplyingRemote = true;
      try {
        Object.assign(A().state, { cheers: merged.cheers, visions: merged.visions, habits: merged.habits, deleted: merged.deleted });
        A().save(true); A().render();
      } finally { isApplyingRemote = false; }
    }
    const seatList = (data, remote) => (data && data.members) ? { ...data.members } : (A().legacyMembersFrom(remote) || null);

    // ==================== PUSH / SUBSCRIBE ====================
    function schedulePush(delay = 400) { pushDirty = true; clearTimeout(pushTimer); pushTimer = setTimeout(runPush, delay); }

    async function runPush() {
      if (!db || !currentUser || isApplyingRemote) return;
      const S = A().state, code = S.roomCode, meId = A().myId();
      if (!code || !meId) return;                       // not a member of a room yet: nothing to publish
      if (pushing) { schedulePush(); return; }
      pushing = true; pushDirty = false;
      try {
        let merged = null, meta = null;
        const pend = A().pendingFor();
        await runTransaction(db, async tx => {
          const ref = roomRef(code), snap = await tx.get(ref);
          const remoteDoc = snap.exists() ? snap.data() : null, remote = remoteDoc ? parsePayload(remoteDoc) : null;
          merged = remote ? mergeShared(sharedSnapshot(), remote, false) : sharedSnapshot();
          A().pruneHistory(merged.habits);
          // Seat list: the cloud copy is authoritative. A room made by the old two-person app gets its seats built here.
          let members = seatList(remoteDoc, remote);
          if (!members) members = { ...S.members };
          if (!members[meId]) {
            if (remoteDoc && remoteDoc.members) { const e = new Error('removed'); e.removed = { members, ownerId: remoteDoc.ownerId || null, name: remoteDoc.name }; throw e; }   // seat was freed: never resurrect it
            members[meId] = S.members[meId];
          }
          members[meId] = { ...members[meId], ...(pend.member || {}), uid: currentUser.uid };
          delete members[meId].at;
          const ids = Object.keys(members);
          if (ids.length > A().MAX_SEATS) { const e = new Error('full'); e.code = 'full'; throw e; }
          const ownerId = (remoteDoc && remoteDoc.ownerId) || S.ownerId || (members.p1 ? 'p1' : ids[0]);
          const name = pend.name || (remoteDoc && remoteDoc.name) || A().roomName();
          const now = Date.now();
          let payload = JSON.stringify({ ...merged, updatedAt: now });
          // Firestore documents max out at 1 MiB. Trim older check-ins first (the app only shows ~6 months of history anyway).
          if (payload.length > 900000) { A().pruneHistory(merged.habits, 180); payload = JSON.stringify({ ...merged, updatedAt: now }); }
          if (payload.length > 1000000) { const e = new Error('too large'); e.code = 'too-large'; throw e; }
          tx.set(ref, clean({ ...(remoteDoc || {}), roomCode: cleanRoomCode(code), name, ownerId, members,
            payload, updatedBy: currentUser.uid, updatedAt: now }));
          meta = { members, ownerId, name };
        });
        if (A().state.roomCode === code) {
          A().clearPending();
          A().onRemoteMeta(meta);
          if (!pushDirty && merged) applyIfChanged(merged);
        }
        setSync(true, 'Live Cloud Sync');
      } catch (err) {
        if (err && err.removed) { A().onRemoteMeta(err.removed); setSync(true, 'Live Cloud Sync'); }
        else if (err && err.code === 'full') { setSync(false, 'Room is full'); }
        else if (err && err.code === 'too-large') { setSync(false, 'Room data too large'); }
        else if (err && err.code === 'permission-denied') {   // rules refuse this write (rules not published, or an old cached app): keep the edits, retry slowly
          console.warn('Push refused by Firestore rules:', err);
          pushDirty = true; setSync(false, 'Local Fallback'); schedulePush(60000);
        }
        else {
          console.warn('Push to cloud error:', err);
          pushDirty = true; setSync(false, 'Offline – will retry'); schedulePush(15000);
        }
      } finally { pushing = false; }
    }

    function subscribe(roomCode) {
      if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
      const target = roomCode ? cleanRoomCode(roomCode) : null;
      // Moving rooms: pending edits belong to the room we left (kept in its local copy, re-merged when it is opened again).
      if (subscribedRoom && subscribedRoom !== target) { pushDirty = false; clearTimeout(pushTimer); }
      subscribedRoom = target;
      if (!db || !currentUser || !target) return;
      unsubscribeRoom = onSnapshot(roomRef(target), snapshot => {
        if (!currentUser || snapshot.metadata.hasPendingWrites || subscribedRoom !== target) return;
        setSync(true, 'Live Cloud Sync');
        if (!snapshot.exists()) { if (A().myId()) schedulePush(0); return; }   // first device creates the room from its local data
        const data = snapshot.data();
        A().onRemoteMeta(data);                                                // seats, owner, room name; may notice we were removed
        const meId = A().myId();
        if (!meId) return;
        const remote = parsePayload(data);
        if (!remote) { if (!data.members) schedulePush(0); return; }
        // If this device has unsent edits its own fields win; otherwise take the cloud's.
        const merged = mergeShared(sharedSnapshot(), remote, !pushDirty);
        A().pruneHistory(merged.habits);
        applyIfChanged(merged);
        // Local had something the cloud lacks (offline edits) or the room predates seats: publish.
        // Also publish when our seat has no phone recorded yet (rooms migrated from the two-person app). Never overwrite a
        // seat that already names a phone from here: two phones sharing one seat would otherwise rewrite it back and forth forever.
        const mine = data.members && data.members[meId];
        if (!data.members || fingerprint(merged) !== fingerprint(remote) || (mine && !mine.uid)) schedulePush(0);
      }, error => { console.warn('Room listener error:', error); setSync(false, 'Local Fallback'); });
    }
    function push(delay) { if (!isApplyingRemote) schedulePush(delay == null ? 400 : delay); }
    async function flush() {   // used when switching rooms: send unsent edits for the room we are leaving
      if (!db || !currentUser || !pushDirty) return;
      clearTimeout(pushTimer);
      await Promise.race([runPush(), new Promise(resolve => setTimeout(resolve, 3000))]);
    }

    // ==================== SEATS: peek, join / claim, remove, leave ====================
    async function ready() {
      if (!currentUser) await Promise.race([readyPromise, new Promise(r => setTimeout(r, 6000))]);
      if (!db || !currentUser) throw { code: 'offline' };
    }
    async function peek(code) {
      await ready();
      let snap; try { snap = await getDoc(roomRef(code)); } catch (e) { throw { code: 'offline' }; }
      if (!snap.exists()) return { exists: false };
      const d = snap.data(), remote = parsePayload(d) || {};
      return { exists: true, name: d.name || '', ownerId: d.ownerId || null, members: seatList(d, remote) || {}, cheers: remote.cheers || [], legacy: !d.members };
    }
    // Join as a new member (name + colour) or claim an existing seat ({ claimId }). One transaction, so two people can never take the last seat.
    async function join(code, opts) {
      await ready();
      let out = null;
      try {
        await runTransaction(db, async tx => {
          const ref = roomRef(code), snap = await tx.get(ref);
          if (!snap.exists()) throw { code: 'missing' };
          const d = snap.data(), remote = parsePayload(d) || {};
          const members = seatList(d, remote) || {};
          let id;
          if (opts.claimId) {
            if (!members[opts.claimId]) throw { code: 'gone' };
            id = opts.claimId; members[id] = { ...members[id], uid: currentUser.uid };
          } else {
            if (Object.keys(members).length >= A().MAX_SEATS) throw { code: 'full', members };
            id = A().newMemberId();
            const taken = new Set(Object.values(members).map(m => m.color));
            const color = opts.color && !taken.has(opts.color) ? opts.color : (A().SWATCHES.find(c => !taken.has(c)) || A().SWATCHES[0]);
            members[id] = { name: String(opts.name || 'Member').slice(0, 20), color, uid: currentUser.uid, joinedAt: Date.now() };
          }
          const keys = Object.keys(members);
          const ownerId = d.ownerId || (members.p1 ? 'p1' : keys[0]);
          const now = Date.now();
          tx.set(ref, clean({ ...d, roomCode: cleanRoomCode(code), name: d.name || '', ownerId, members, payload: d.payload || JSON.stringify({ cheers: [], visions: [], habits: [], deleted: {} }), updatedBy: currentUser.uid, updatedAt: now }));
          out = { id, members, ownerId, name: d.name || '', payload: remote };
        });
      } catch (e) {
        if (e && e.code === 'permission-denied') throw { code: 'full' };
        if (e && (e.code === 'unavailable' || e.code === 'deadline-exceeded')) throw { code: 'offline' };
        throw e && e.code ? e : { code: 'error', message: String(e && e.message || e) };
      }
      return out;
    }
    async function dropMember(code, id) {
      await ready();
      await runTransaction(db, async tx => {
        const ref = roomRef(code), snap = await tx.get(ref);
        if (!snap.exists()) return;
        const d = snap.data(), members = { ...(d.members || {}) };
        if (!members[id]) return;
        delete members[id];
        let ownerId = d.ownerId || null;
        if (ownerId === id) {   // hand the room to whoever has been in it longest
          const left = Object.keys(members).sort((a, b) => (members[a].joinedAt || 0) - (members[b].joinedAt || 0));
          ownerId = left[0] || null;
        }
        tx.set(ref, clean({ ...d, members, ownerId, updatedBy: currentUser.uid, updatedAt: Date.now() }));
      });
    }

    async function initCloudSync() {
      if (!FIREBASE_CONFIG.apiKey) { setSync(false, 'Local Mode'); console.info('Apex: add your Firebase config (see SETUP.md) to enable live sync.'); readyResolve(); if (window.__resolveCloud) window.__resolveCloud(); return; }
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        db = getFirestore(app);
        const cred = await signInAnonymously(getAuth(app));
        currentUser = cred.user; Cloud.available = true;
        subscribe(A().state.roomCode);
      } catch (err) { console.warn('Cloud sync fallback to local mode:', err); setSync(false, 'Local Mode'); }
      finally { readyResolve(); if (window.__resolveCloud) window.__resolveCloud(); }
    }

    const Cloud = window.Cloud = { available: false, uid: () => (currentUser ? currentUser.uid : null), push, flush, subscribe, peek, join, leave: dropMember, removeMember: dropMember };

    // Retry pending edits as soon as connectivity / focus returns (important on iPhone).
    window.addEventListener('online', () => { if (pushDirty) schedulePush(0); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && pushDirty) schedulePush(0); });

    initCloudSync();
  </script>
</body>
</html>
